name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: task_manager
          MYSQL_USER: sayuball
          MYSQL_PASSWORD: 19346
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Setup Node (NO CACHE -> FIX ERROR 100%)
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # =========================
      # Wait for MySQL ready
      # =========================
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -prootpassword && break
            echo "waiting mysql..."
            sleep 2
          done

      # =========================
      # Import DB schema + seed
      # =========================
      - name: Setup database
        run: |
          mysql -h 127.0.0.1 -uroot -prootpassword task_manager < backend/sql/schema.sql
          mysql -h 127.0.0.1 -uroot -prootpassword task_manager < backend/sql/seed.sql

      # =========================
      # Lint
      # =========================
      - name: Run lint
        working-directory: backend
        run: npm run lint --if-present

      # =========================
      # Test
      # =========================
      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: sayuball
          DB_PASSWORD: 19346
          DB_NAME: task_manager
          JWT_SECRET: testsecret
          JWT_EXPIRES_IN: 1d
        run: npm test --if-present