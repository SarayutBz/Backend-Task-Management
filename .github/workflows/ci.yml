name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: task_manager
          MYSQL_USER: sayuball
          MYSQL_PASSWORD: 19346
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Import schema
        run: |
          mysql -h 127.0.0.1 -u appuser -papppassword task_manager < sql/schema.sql

      - name: Run lint
        working-directory: backend
        run: npm run lint --if-present

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: sayuball
          DB_PASSWORD: 19346
          DB_NAME: task_manager
          JWT_SECRET: testsecret
          JWT_EXPIRES_IN: 1d
        run: npm test --if-present